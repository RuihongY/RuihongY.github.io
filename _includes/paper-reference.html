<li class="reference"><span class="reference__authors">{{ include.post.authors | append: "." | replace: "..", "." | replace: "R. Yin", "<b>R. Yin</b>" }}</span> <a href="{{ base_path }}{{ include.post.url }}">{{ include.post.title }}</a>. <i>{{ include.post.venue }}</i> ({{ include.post.date | date: "%Y" }}).</li>
