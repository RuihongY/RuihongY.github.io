# Site Settings
locale                   : "en-US"
title                    : "Ruihong Yin"
title_separator          : "-"
name                     : &name "Ruihong Yin"
description              : &description "PhD Candidate in ECE at University of Minnesota. Research in domain-specific acceleration, hardware–software co-design, and physics-based Ising computing."
url                      : "https://RuihongY.github.io"
baseurl                  : ""
repository               : "RuihongY/RuihongY.github.io"

# Site Author
author:
  name             : "Ruihong Yin"
  avatar           : "images/profile.jpg"
  bio              : "PhD Candidate, ECE<br>University of Minnesota"
  location         : "Minneapolis, MN"
  email            : "yin00473@umn.edu"
  uri              :
  googlescholar    :
  github           : "RuihongY"
  linkedin         : "ruihong-yin"
  orcid            :

# Reading Files
include:
  - .htaccess
  - _pages
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Chicago

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
